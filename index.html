<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eikichi Racing Simulator</title>
<style>
body{margin:0;background:#07111f;color:#eef5ff;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif}main{max-width:1080px;margin:auto;padding:12px}h1{font-size:23px;margin:8px 0}.panel{background:#0d1b2e;border:1px solid #26364d;border-radius:14px;padding:12px;margin:10px 0}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;align-items:end}select,button,input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #34465f;background:#13243a;color:#eef5ff;box-sizing:border-box}textarea{height:190px;font-family:monospace;font-size:12px;white-space:pre;overflow:auto}button{background:#e8465f;border:0;font-weight:800;cursor:pointer}.gray{background:#2b3f59}.green{background:#2f9e44}#track{position:relative;height:390px;background:#10263e;border-radius:14px;overflow:hidden}svg{position:absolute;inset:0;width:100%;height:100%}.horse{position:absolute;width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#06101d;border:2px solid white;transform:translate(-50%,-50%);z-index:5}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px;border-bottom:1px solid #26364d;text-align:left}th{color:#e1c766}.small{font-size:12px;color:#9fb0c7;line-height:1.5}.ok{color:#8cec7d}.warn{color:#ffd166}.badge{display:inline-block;padding:2px 7px;border-radius:99px;background:#223653}
</style></head><body><main>
<h1 id="title">Eikichi Racing Simulator</h1>
<div class="small">CSV/TSV貼り付け対応。能力0.45・タイム0.10・血統0.35・調教0.05・騎手0.05＋生き物ブレ。</div>
<div class="panel"><h3>出走表貼り付け</h3><div class="controls">
<div><label>レース名</label><input id="raceName" value="函館6R 未勝利"></div>
<div><label>コース</label><select id="course"><option value="hakodate_d1700" selected>函館ダ1700</option><option value="hanshin_t2200">阪神芝2200</option><option value="tokyo_t1600">東京芝1600</option><option value="tokyo_t2400">東京芝2400</option><option value="nakayama_t2500">中山芝2500</option><option value="kyoto_t2200">京都芝2200</option><option value="kyoto_d1800">京都ダ1800</option><option value="tokyo_d1600">東京ダ1600</option></select></div>
<div><label>タイム列</label><select id="timeCol"><option value="近3走タイム評価" selected>近3走タイム評価</option><option value="最高タイム評価">最高タイム評価</option><option value="推定タイム評価">推定タイム評価</option><option value="タイム指数">タイム指数</option></select></div><button id="load" class="green">出走表読込</button>
</div><textarea id="csvInput">日付	場所	レース	コース	芝ダ	距離	レース名	馬名	馬番	騎手	種牡馬	父タイプ名	母父タイプ名	父母父タイプ名	母母父タイプ名	前走脚質	斤量	推定タイム評価	最高タイム評価	近3走タイム評価	同コース	同距離	同場所	１走前	2走前	3走前	能力	調教
613	函館	函6		ダ	1700	未勝利	 トーセンアミューズ	1	小崎綾也	ダイワメジャー	サンデーサイレンス系	キングマンボ系	ニアークティック系	ニアークティック系	後	57	113	113	108		-	-	109	113	101	D	A
613	函館	函6		ダ	1700	未勝利	 オンザムービー	2	横山和生	サンダースノー	ダンチヒ系	サンデーサイレンス系	キングマンボ系	ダンチヒ系	先	57	134	134	129	-	-		125	129	134	A	C
613	函館	函6		ダ	1700	未勝利	 コイオステソーロ	10	丹内祐次	ナダル	ロイヤルチャージャー系	ネイティヴダンサー系	ナスルーラ系	マンノウォー系	先	57	141	141	137	-			140	131	141	S	C
613	函館	函6		ダ	1700	未勝利	 キセログラフィカ	11	横山武史	ナダル	ロイヤルチャージャー系	サンデーサイレンス系	ナスルーラ系	キングマンボ系	先	57	131	131	130	-			131	131	127	S	A
613	函館	函6		ダ	1700	未勝利	 エトワールブルー	12	遠藤汰月	サートゥルナーリア	キングマンボ系	サンデーサイレンス系	サンデーサイレンス系	ニアークティック系	中	54▲	121	121	120	-			118	121	120	D	B</textarea><div id="loadMsg" class="small"></div></div>
<div class="panel controls">
<div><label>ペース</label><select id="pace"><option value="slow">スロー</option><option value="middle" selected>ミドル</option><option value="high">ハイ</option></select></div>
<div><label>馬場</label><select id="going"><option value="firm">良・高速寄り</option><option value="normal" selected>良・標準</option><option value="soft">稍重〜重</option><option value="bad">不良・力要る</option></select></div>
<div><label>予想反映度 <span id="wtxt">70</span>%</label><input id="weight" type="range" min="20" max="95" value="70"></div>
<div><label>乱数</label><select id="noise"><option value="0.6">少なめ</option><option value="1" selected>標準</option><option value="1.4">多め</option><option value="2.0">荒れ気味</option></select></div>
<div><label>生き物ブレ</label><select id="life"><option value="0.8">小</option><option value="1.3" selected>標準</option><option value="2.0">大</option></select></div>
<button id="one">▶ 1回再生</button><button id="many" class="gray">📊 300回検証</button><button id="reset" class="gray">↻ リセット</button>
</div>
<div class="panel"><div id="track"><svg id="courseSvg" viewBox="0 0 1000 520" preserveAspectRatio="none"></svg></div></div>
<div class="panel"><h3>順位</h3><div id="rank">未実行</div></div>
<div class="panel"><h3>300回検証結果</h3><div id="result">未実行</div></div>
</main>
<script>
(function(){
const E=id=>document.getElementById(id);let horses=[],timer=null,divs=[],path=[],seg=[],total=0,currentState=null;
const grade={S:100,AA:95,A:88,B:76,C:64,D:52};
const jockey={"ルメール":10,"レーン":9,"川田将雅":8,"武豊":5,"戸崎圭太":4,"坂井瑠星":4,"松山弘平":3,"横山武史":3,"岩田望来":3,"横山和生":3,"丹内祐次":2};
const colors=["#ff5a5f","#ffd166","#06d6a0","#4cc9f0","#f72585","#b8f2e6","#c77dff","#90be6d","#f8961e","#adb5bd"];
const courses={hakodate_d1700:{name:"函館ダ1700",bias:"小回り・先行持続",kind:"dirt"},hanshin_t2200:{name:"阪神芝2200",bias:"内回り・持続力",kind:"turf"},tokyo_t1600:{name:"東京芝1600",bias:"長い直線・差し",kind:"turf"},tokyo_t2400:{name:"東京芝2400",bias:"長い直線・総合力",kind:"turf"},nakayama_t2500:{name:"中山芝2500",bias:"小回り・先行スタミナ",kind:"turf"},kyoto_t2200:{name:"京都芝2200",bias:"下り坂・ロングスパート",kind:"turf"},kyoto_d1800:{name:"京都ダ1800",bias:"先行・持続",kind:"dirt"},tokyo_d1600:{name:"東京ダ1600",bias:"外枠・持続差し",kind:"dirt"}};
const oval=[[815,365],[705,398],[540,410],[360,405],[245,382],[95,335],[70,240],[115,158],[265,112],[500,100],[730,120],[885,190],[895,300],[820,365],[670,392],[480,402],[315,395],[245,382]];
function setCourse(){const c=courses[E("course").value]||courses.hakodate_d1700;path=oval;seg=[];total=0;for(let i=0;i<path.length-1;i++){let dx=path[i+1][0]-path[i][0],dy=path[i+1][1]-path[i][1],l=Math.hypot(dx,dy);seg.push(l);total+=l}let d=path.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');E("courseSvg").innerHTML=`<rect width="1000" height="520" fill="#10263e"/><path d="${d}" fill="none" stroke="#3c9a50" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#8cec7d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="500" cy="255" rx="285" ry="90" fill="#071f10"/><line x1="${path[0][0]}" y1="${path[0][1]+55}" x2="${path[0][0]}" y2="${path[0][1]-30}" stroke="#f4d94f" stroke-width="5"/><line x1="${path[path.length-1][0]}" y1="${path[path.length-1][1]+45}" x2="${path[path.length-1][0]}" y2="${path[path.length-1][1]-45}" stroke="#fff" stroke-width="4" stroke-dasharray="8 7"/><text x="500" y="248" fill="#e1c766" font-size="25" font-weight="700" text-anchor="middle">${c.name}</text><text x="500" y="282" fill="#9fd4ff" font-size="18" font-weight="700" text-anchor="middle">${c.bias}</text>`}
function parseTable(text){text=text.trim();if(!text)throw new Error("出走表が空です");const delim=text.includes("\t")?"\t":",";const lines=text.split(/\r?\n/).filter(x=>x.trim());const headers=lines[0].split(delim).map(x=>x.trim());return lines.slice(1).map(line=>{const cols=line.split(delim),r={};headers.forEach((h,j)=>r[h]=(cols[j]||"").trim());return r})}
function num(v,d=0){v=String(v||"").replace(/[▲☆★]/g,"").replace("-","").trim();let n=parseFloat(v);return isNaN(n)?d:n}
function style(s){s=String(s||"").trim();if(s.includes("逃"))return"逃げ";if(s.includes("先"))return"先行";if(s.includes("中"))return"中団";if(s.includes("後"))return"後方";if(s.includes("差"))return"差し";return"中団"}
function loadData(){try{const rows=parseTable(E("csvInput").value),tc=E("timeCol").value;horses=rows.map(r=>({レース名:r["レース名"]||E("raceName").value,場所:r["場所"]||"",芝ダ:r["芝ダ"]||"",距離:num(r["距離"],0),馬名:(r["馬名"]||"").trim().replace("$",""),馬番:parseInt(r["馬番"]||"0",10),騎手:r["騎手"]||"",種牡馬:r["種牡馬"]||"",父タイプ名:r["父タイプ名"]||"",母父タイプ名:r["母父タイプ名"]||"",父母父タイプ名:r["父母父タイプ名"]||"",母母父タイプ名:r["母母父タイプ名"]||"",脚質:style(r["脚質"]||r["前走脚質"]),能力:r["能力"]||"C",調教:r["調教"]||"C",タイム指数:num(r[tc]||r["タイム指数"],100),斤量:num(r["斤量"],57)})).filter(h=>h.馬名&&h.馬番);if(!horses.length)throw new Error("馬名・馬番が読み込めません");const first=horses[0];E("raceName").value=(first.場所?first.場所+" ":"")+(first.レース名||"");E("title").textContent=E("raceName").value+" / "+(courses[E("course").value]?.name||"");E("loadMsg").innerHTML=`<span class="ok">読込成功：</span>${horses.length}頭 / タイム列=${tc} / 脚質=前走脚質`;setup()}catch(e){E("loadMsg").innerHTML=`<span class="warn">読込失敗：</span>${e.message}`}}
function blood(h){let all=h.父タイプ名+h.母父タイプ名+h.父母父タイプ名+h.母母父タイプ名+h.種牡馬;let s=70;if(all.includes("サンデー"))s+=6;if(all.includes("キングマンボ"))s+=5;if(all.includes("ロイヤル"))s+=4;if(all.includes("トニービン"))s+=4;if(all.includes("ナスルーラ"))s+=3;if(all.includes("ダンチヒ"))s+=2;if(all.includes("ゴールドシップ")||all.includes("キタサンブラック")||all.includes("ハーツクライ"))s+=5;if(all.includes("エピファネイア")||all.includes("キズナ")||all.includes("ナダル"))s+=4;return Math.min(100,s)}
function base(h){let ab=grade[h.能力]||65,tr=grade[h.調教]||70,ti=Math.max(50,Math.min(100,50+(h.タイム指数-100)*0.65));return ab*0.45+ti*0.10+blood(h)*0.35+tr*0.05+((jockey[h.騎手]||0)*0.05)}
function courseAdj(h,p){const c=courses[E("course").value]||courses.hakodate_d1700;let s=0,st=h.脚質;if(c.name.includes("函館")||c.name.includes("中山")||c.name.includes("阪神")||c.name.includes("京都ダ")){if(st==="逃げ"||st==="先行")s+=2;if(st==="後方"&&p>.65)s-=2}if(c.name.includes("東京")){if(st==="差し"||st==="中団")s+=2;if(h.馬番>=13)s+=1}if(c.kind==="dirt"){if(h.父タイプ名.includes("ロイヤル")||h.父タイプ名.includes("ダンチヒ")||h.父タイプ名.includes("ニアークティック"))s+=2}return s}
function adj(h,p){let pace=E("pace").value,going=E("going").value,st=h.脚質,s=courseAdj(h,p);if(pace==="slow"&&(st==="逃げ"||st==="先行"))s+=4;if(pace==="high"&&st==="逃げ"&&p>.55)s-=7;if(pace==="high"&&(st==="差し"||st==="後方")&&p>.55)s+=5;if(pace==="middle"&&st==="先行")s+=2;if(pace==="middle"&&(st==="差し"||st==="中団")&&p>.65)s+=2;if(going==="firm"&&h.タイム指数>=130)s+=2;if(going==="soft"&&(h.種牡馬.includes("ゴールドシップ")||h.母父タイプ名.includes("トニービン")||h.父タイプ名.includes("ロイヤル")))s+=3;if(going==="bad"&&E("course").value.includes("_d")&&st==="先行")s+=3;return s}
function rnd(){return Math.random()+Math.random()+Math.random()-1.5}
function point(p,lane){p=Math.max(0,Math.min(1,p));let d=p*total,acc=0,i=0;for(;i<seg.length;i++){if(acc+seg[i]>=d)break;acc+=seg[i]}if(i>=seg.length)i=seg.length-1;let f=(d-acc)/seg[i],a=path[i],b=path[i+1];return [a[0]+(b[0]-a[0])*f+lane*4,a[1]+(b[1]-a[1])*f+lane*3]}
function raceState(){let life=Number(E("life").value);return horses.map(h=>{let condition=rnd()*life*3.2,trip=0,r=Math.random();if(r<0.045*life)trip-=8+Math.random()*7;else if(r<0.10*life)trip-=3+Math.random()*4;else if(r>1-0.035*life)trip+=3+Math.random()*4;return{condition,trip,stamina:rnd()*life*1.8}})}
function setup(){if(timer)clearInterval(timer);setCourse();E("track").querySelectorAll(".horse").forEach(x=>x.remove());divs=[];horses.forEach((h,i)=>{let d=document.createElement("div");d.className="horse";d.textContent=h.馬番;d.title=h.馬名;d.style.background=colors[i%colors.length];E("track").appendChild(d);divs.push(d)});render(horses.map((h,i)=>-i*.004),[])}
function render(prog,order){const box=E("track").getBoundingClientRect();prog.forEach((p,i)=>{let q=point(p,(i%4)-1.5);if(divs[i]){divs[i].style.left=(q[0]/1000*box.width)+"px";divs[i].style.top=(q[1]/520*box.height)+"px"}});let rows=[];order.forEach(i=>rows.push({i,done:true,p:prog[i]}));horses.forEach((h,i)=>{if(!order.includes(i))rows.push({i,done:false,p:prog[i]})});rows.sort((a,b)=>a.done&&b.done?order.indexOf(a.i)-order.indexOf(b.i):a.done?-1:b.done?1:b.p-a.p);E("rank").innerHTML="<table><tr><th>順</th><th>馬番</th><th>馬名</th><th>脚質</th><th>状態</th></tr>"+rows.map((r,k)=>"<tr><td>"+(k+1)+"</td><td><span class='badge'>"+horses[r.i].馬番+"</span></td><td>"+horses[r.i].馬名+"</td><td>"+horses[r.i].脚質+"</td><td>"+(r.done?"FINISH":Math.max(0,Math.min(100,Math.round(r.p*100)))+"%")+"</td></tr>").join("")+"</table>"}
function speed(h,p,i){let w=Number(E("weight").value)/100,n=Number(E("noise").value),st=currentState?currentState[i]:{condition:0,trip:0,stamina:0};let raw=base(h)+adj(h,p)+st.condition+st.trip;let sp=.0042+((raw-70)/9000)*w+rnd()*n*(1.30-w)/360;if(h.脚質==="逃げ"&&p<.45)sp+=.00016;if((h.脚質==="差し"||h.脚質==="後方")&&p>.70)sp+=.00022;if(p>.72)sp+=st.stamina/18000;return Math.max(.0018,sp)}
function runOne(){if(!horses.length)loadData();setup();currentState=raceState();let prog=horses.map((h,i)=>-i*.004),order=[],count=0;timer=setInterval(()=>{let p=Math.max(...prog);horses.forEach((h,i)=>{if(prog[i]<1)prog[i]+=speed(h,p,i);if(prog[i]>=1&&!order.includes(i))order.push(i)});render(prog,order);count++;if(order.length===horses.length||count>900)clearInterval(timer)},30)}
function oneRaceOrder(){let life=Number(E("life").value),noiseLv=Number(E("noise").value);let score=horses.map((h,i)=>{let b=base(h),p=.70,a=adj(h,p),noise=rnd()*noiseLv*7.5,condition=rnd()*life*4.2,accident=0,r=Math.random();if(r<0.055*life)accident-=8+Math.random()*9;else if(r<0.13*life)accident-=3+Math.random()*5;else if(r>1-0.04*life)accident+=3+Math.random()*5;let cap=0;if(b>92&&Math.random()<0.18*life)cap-=3+Math.random()*5;return{i,score:b+a+noise+condition+accident+cap}});score.sort((a,b)=>b.score-a.score);return score.map(x=>x.i)}
function runMany(){if(!horses.length)loadData();let n=300,st=horses.map(h=>({h,w:0,p2:0,p3:0,rs:0}));for(let m=0;m<n;m++){let o=oneRaceOrder();o.forEach((idx,j)=>{st[idx].rs+=j+1;if(j===0)st[idx].w++;if(j<2)st[idx].p2++;if(j<3)st[idx].p3++})}st.sort((a,b)=>b.w-a.w||b.p3-a.p3);E("result").innerHTML="<table><tr><th>順</th><th>馬番</th><th>馬名</th><th>勝率</th><th>連対</th><th>複勝</th><th>平均</th><th>基礎</th></tr>"+st.map((s,i)=>"<tr><td>"+(i+1)+"</td><td>"+s.h.馬番+"</td><td>"+s.h.馬名+"</td><td>"+(s.w/n*100).toFixed(1)+"%</td><td>"+(s.p2/n*100).toFixed(1)+"%</td><td>"+(s.p3/n*100).toFixed(1)+"%</td><td>"+(s.rs/n).toFixed(2)+"</td><td>"+base(s.h).toFixed(1)+"</td></tr>").join("")+"</table>"}
E("load").addEventListener("click",loadData);E("one").addEventListener("click",runOne);E("many").addEventListener("click",runMany);E("reset").addEventListener("click",setup);E("course").addEventListener("change",()=>{E("title").textContent=E("raceName").value+" / "+(courses[E("course").value]?.name||"");setup()});E("raceName").addEventListener("input",()=>E("title").textContent=E("raceName").value+" / "+(courses[E("course").value]?.name||""));E("weight").addEventListener("input",e=>E("wtxt").textContent=e.target.value);loadData();
})();
</script></body></html>
